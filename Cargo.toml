[workspace]
resolver = "3"
members = [
    "src/openseries-lib",
    "src/openseries-cli",
    "examples/chatmix-bar",
    "examples/mouse-police-lights",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PicoShot/openseries-gg"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.13"
bitflags = "2.9.4"
clap = { version = "4.6.4", features = ["derive"] }
comfy-table = { version = "7.2.2", default-features = false }
ctrlc = "3.5.0"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.17"
