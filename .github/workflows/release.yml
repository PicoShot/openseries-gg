name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: openseries
            asset: openseries-linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: openseries
            asset: openseries-linux-arm64
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: openseries.exe
            asset: openseries-windows-x64.exe
          - name: Windows x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            executable: openseries.exe
            asset: openseries-windows-x86.exe
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: openseries.exe
            asset: openseries-windows-arm64.exe
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: openseries
            asset: openseries-macos-x64
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            executable: openseries
            asset: openseries-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux HID development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --package openseries-gg --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            "release-assets/${{ matrix.asset }}"
          printf '%s|%s\n' \
            "${{ matrix.asset }}" "${{ matrix.name }}" \
            > "release-assets/manifest-${{ matrix.target }}.txt"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download successful platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          while IFS='|' read -r file label
          do
            assets+=("artifacts/$file#$label")
          done < <(cat artifacts/manifest-*.txt)

          if [ "${#assets[@]}" -eq 0 ]
          then
            echo "No platform artifacts were published."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${assets[@]}"
