name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish Linux x64
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/OpenSeries.Cli/OpenSeries.Cli.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -p:PublishDir="$GITHUB_WORKSPACE/artifacts/linux-x64/" \
            --maxcpucount:1 \
            -p:UseSharedCompilation=false
          cp artifacts/linux-x64/openseries artifacts/openseries-linux-x64

      - name: Publish Windows x64
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/OpenSeries.Cli/OpenSeries.Cli.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained false \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -p:PublishDir="$GITHUB_WORKSPACE/artifacts/win-x64/" \
            --maxcpucount:1 \
            -p:UseSharedCompilation=false
          cp artifacts/win-x64/openseries.exe artifacts/openseries-windows-x64.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --draft
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
          "artifacts/openseries-linux-x64#Linux x64 (.NET 10 required)"
          "artifacts/openseries-windows-x64.exe#Windows x64 (.NET 10 required)"
