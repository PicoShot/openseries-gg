name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            rid: linux-x64
            executable: openseries
            asset: openseries-linux-x64
            standalone-asset: openseries-linux-x64-standalone
          - name: Linux ARM64
            rid: linux-arm64
            executable: openseries
            asset: openseries-linux-arm64
            standalone-asset: openseries-linux-arm64-standalone
          - name: Windows x64
            rid: win-x64
            executable: openseries.exe
            asset: openseries-windows-x64.exe
            standalone-asset: openseries-windows-x64-standalone.exe
          - name: Windows x86
            rid: win-x86
            executable: openseries.exe
            asset: openseries-windows-x86.exe
            standalone-asset: openseries-windows-x86-standalone.exe
          - name: Windows ARM64
            rid: win-arm64
            executable: openseries.exe
            asset: openseries-windows-arm64.exe
            standalone-asset: openseries-windows-arm64-standalone.exe
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish framework-dependent binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          dotnet publish src/OpenSeries.Cli/OpenSeries.Cli.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -p:PublishDir="$GITHUB_WORKSPACE/publish/framework/" \
            --maxcpucount:1 \
            -p:UseSharedCompilation=false
          cp "publish/framework/${{ matrix.executable }}" \
            "release-assets/${{ matrix.asset }}"

      - name: Publish standalone binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/OpenSeries.Cli/OpenSeries.Cli.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -p:PublishDir="$GITHUB_WORKSPACE/publish/standalone/" \
            --maxcpucount:1 \
            -p:UseSharedCompilation=false
          cp "publish/standalone/${{ matrix.executable }}" \
            "release-assets/${{ matrix.standalone-asset }}"

      - name: Create asset manifest
        shell: bash
        run: |
          printf '%s|%s (.NET 10 runtime required)\n' \
            "${{ matrix.asset }}" "${{ matrix.name }}" \
            > "release-assets/manifest-${{ matrix.rid }}.txt"
          printf '%s|%s standalone\n' \
            "${{ matrix.standalone-asset }}" "${{ matrix.name }}" \
            >> "release-assets/manifest-${{ matrix.rid }}.txt"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download successful platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          while IFS='|' read -r file label
          do
            assets+=("artifacts/$file#$label")
          done < <(cat artifacts/manifest-*.txt)

          if [ "${#assets[@]}" -eq 0 ]
          then
            echo "No platform artifacts were published."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${assets[@]}"
